[pytest]
testpaths = tests
addopts = -ra
markers =
    tc(*ids): identifiants des cas de test (docs/TEST_CASES.md) couverts par ce test automatisé
    unit: test de composant (fonctions pures, sans HTTP ni base)
    api: test d'intégration / système via l'API HTTP
    property: test basé sur les propriétés (Hypothesis)
    security: test lié à la sécurité
    nonfunctional: test non fonctionnel (performance, fiabilité)
